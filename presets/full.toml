# Complete Profile: Installs the full developer stack (Rust, Web, Mobile, AeroSpace, Neovim, GUI Apps)
name = "Complete Experience"
description = "Full stack developer environment with AeroSpace, Ghostty, Neovim, Rust, Web, Flutter, and curated GUI tools."

[config.git]
delta_side_by_side = true

[config.theme]
palette = "catppuccin_mocha"
font = "0xProto Nerd Font Mono"
ghostty_opacity = "0.88"
ghostty_blur = "20"
ghostty_titlebar = "hidden"

[config.window_manager]
enabled = true
modifier = "alt"
gaps = 8
border_color = "0xffcba6f7"
border_width = "4.0"
border_radius = "10.0"

[config.macos_defaults]
enabled = true
dock_autohide = true
dock_fast_animation = true
screenshots_dir = "~/Screenshots"
fast_keyboard_repeat = true

# Browser casks to install. Zen is the main browser; Brave and Chrome round out
# Chromium coverage. This does not touch the macOS default browser.
[config.browsers]
install = ["zen", "brave-browser", "google-chrome"]

[categories]
window_management = true
terminal = true
core_cli = true
modern_cli = true
shell_quality = true
ai = true
editors = true
git_tuis = true
rust = true
web = true
mobile = true
browsers = true
gui_core = true
fonts = true
security = true
creative = true
custom_tap = true
