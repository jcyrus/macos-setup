# Web Developer Profile: Node.js (FNM), pnpm, VS Code, Browsers, OrbStack, TablePlus, Bruno
name = "Full-Stack Web"
description = "Curated environment for Next.js, Node, TypeScript, container workflows (OrbStack), API testing, and web development."

[config.git]
delta_side_by_side = true

[config.theme]
palette = "catppuccin_mocha"
font = "0xProto Nerd Font Mono"
ghostty_opacity = "0.90"
ghostty_blur = "20"
ghostty_titlebar = "hidden"

[config.window_manager]
enabled = false
modifier = "alt"
gaps = 8
border_color = "0xffcba6f7"
border_width = "4.0"
border_radius = "10.0"

[config.macos_defaults]
enabled = true
dock_autohide = true
dock_fast_animation = true
screenshots_dir = "~/Screenshots"
fast_keyboard_repeat = true

[categories]
window_management = false
terminal = true
core_cli = true
modern_cli = true
shell_quality = true
ai = true
editors = true
git_tuis = true
rust = false
web = true
mobile = false
gui_core = true
fonts = true
security = true
creative = false
custom_tap = false

[packages.skip]
formulae = ["bacon", "cargo-binstall", "cocoapods", "scrcpy", "darktable", "imagemagick"]
casks = ["aerospace", "figma", "darktable", "stremio"]
