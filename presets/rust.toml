# Rust / Systems Profile: Rustup, Cargo tools, Bacon, Neovim, Lazygit, Yazi, CLI utilities
name = "Systems & Rust"
description = "High-performance systems programming stack with Rustup, Bacon, Cargo Binstall, Neovim (LazyVim), and terminal utilities."

[config.git]
delta_side_by_side = true

[config.theme]
palette = "catppuccin_mocha"
font = "0xProto Nerd Font Mono"
ghostty_opacity = "0.92"
ghostty_blur = "15"
ghostty_titlebar = "hidden"

[config.window_manager]
enabled = true
modifier = "alt"
gaps = 8
border_color = "0xffcba6f7"
border_width = "4.0"
border_radius = "10.0"

[config.macos_defaults]
enabled = true
dock_autohide = true
dock_fast_animation = true
screenshots_dir = "~/Screenshots"
fast_keyboard_repeat = true

[categories]
window_management = true
terminal = true
core_cli = true
modern_cli = true
shell_quality = true
ai = true
editors = true
git_tuis = true
rust = true
web = false
mobile = false
gui_core = false
fonts = true
security = false
creative = false
custom_tap = true

[packages.skip]
formulae = ["fnm", "pnpm", "cocoapods", "scrcpy", "imagemagick"]
casks = ["visual-studio-code", "brave-browser", "tableplus", "bruno", "figma", "darktable", "stremio", "spotify", "telegram"]
