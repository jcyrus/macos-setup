# ==========================================
# Terminal & Mouse Settings
# ==========================================
set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# ==========================================
# Quality of Life & Navigation
# ==========================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g status-keys vi

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Open splits & new windows in current working directory
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config shortcut
bind r source-file ~/.tmux.conf \; display "Tmux configuration reloaded!"

# ==========================================
# Catppuccin Theme & Status Bar UI
# ==========================================
set -g status-position top

set -g status-left-length 100
set -g status-right-length 100

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_default_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_date_time_text '%m-%d %H:%M'

# ==========================================
# Plugins (TPM)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Pinned: this config uses the v2 `@catppuccin_status_*` interface. Keep the
# tag in sync with CATPPUCCIN_TMUX_VERSION in install.sh. Because the pin is a
# tag, `prefix + U` reports an update failure for this plugin rather than
# moving it off the pinned version; that is intentional. Bump the tag in both
# places to upgrade.
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
